# Builds calc_lang for Linux, Windows and macOS whenever a version tag
# like v0.1.1 is pushed, and attaches the files to a GitHub Release.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release and upload files

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64 # Apple Silicon (M1, M2, M3...)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64 # older Intel Macs
            os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run tests
        if: matrix.target != 'x86_64-apple-darwin' # can't run Intel tests on an ARM runner
        run: cargo test --release

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ARCHIVE="calc_lang-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz"
          cp README.md LICENSE "target/${{ matrix.target }}/release/"
          tar -czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" calc_lang README.md LICENSE
          echo "ASSET=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "calc_lang-$env:GITHUB_REF_NAME-${{ matrix.name }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/calc_lang.exe", README.md, LICENSE -DestinationPath $archive
          "ASSET=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true